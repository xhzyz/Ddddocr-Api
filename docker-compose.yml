services:
  ddddocr-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/ddddocr-api:1.6.1
    container_name: ddddocr-api
    ports:
      # Defaults to localhost only. Set DDDDOCR_BIND_IP=0.0.0.0 when the
      # service must be reachable from another host (prefer a reverse proxy).
      - "${DDDDOCR_BIND_IP:-127.0.0.1}:${DDDDOCR_PUBLIC_PORT:-5555}:8000"
    environment:
      DDDDOCR_HOST: 0.0.0.0
      DDDDOCR_PORT: 8000
      DDDDOCR_WORKERS: ${DDDDOCR_WORKERS:-1}
      DDDDOCR_OCR: ${DDDDOCR_OCR:-true}
      DDDDOCR_DET: ${DDDDOCR_DET:-false}
      DDDDOCR_OLD: ${DDDDOCR_OLD:-false}
      DDDDOCR_BETA: ${DDDDOCR_BETA:-false}
      DDDDOCR_USE_GPU: ${DDDDOCR_USE_GPU:-false}
      DDDDOCR_DEVICE_ID: ${DDDDOCR_DEVICE_ID:-0}
      DDDDOCR_SHOW_AD: ${DDDDOCR_SHOW_AD:-false}
      DDDDOCR_IMPORT_ONNX_PATH: ${DDDDOCR_IMPORT_ONNX_PATH:-}
      DDDDOCR_CHARSETS_PATH: ${DDDDOCR_CHARSETS_PATH:-}
      DDDDOCR_API_KEY: ${DDDDOCR_API_KEY:-}
      DDDDOCR_CORS_ORIGINS: ${DDDDOCR_CORS_ORIGINS:-}
      DDDDOCR_MAX_IMAGE_BYTES: ${DDDDOCR_MAX_IMAGE_BYTES:-8388608}
      DDDDOCR_MAX_IMAGE_SIDE: ${DDDDOCR_MAX_IMAGE_SIDE:-4096}
      DDDDOCR_MAX_BATCH_SIZE: ${DDDDOCR_MAX_BATCH_SIZE:-32}
      DDDDOCR_MAX_INSTANCES: ${DDDDOCR_MAX_INSTANCES:-8}
      DDDDOCR_INSTANCE_TTL_SECONDS: ${DDDDOCR_INSTANCE_TTL_SECONDS:-3600}
    volumes:
      - ./custom_models:/models:ro
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
